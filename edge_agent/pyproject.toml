[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent"
version = "0.1.0"
description = "People counter edge agent: video -> detector -> tracker -> line crossing -> SQLite -> HTTPS"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["edge_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
